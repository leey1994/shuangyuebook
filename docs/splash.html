<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爽阅 · 开屏</title>
<meta name="description" content="爽阅 —— 爽快阅读，想看就看。Android 与 Windows 双端小说阅读器。">
<link rel="icon" href="assets/favicon.png">
<style>
/* 开屏页：背景图**只画渐变和小兽**，文字全是真实 HTML。
   之前把宣传语烤进了 1080x1920 的竖图，横屏视口 cover 裁一遍之后
   按钮正好压在字上 —— 文字一旦进图就再也不能响应式了。 */
:root{ --fg:#eef3fb; --dim:#9fb0c8; --accent:#ffd65a; }
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--fg); background-color:#0b1020;
  background-repeat:no-repeat; background-position:center; background-size:cover;
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* 两套背景各取所长：竖屏那张小兽靠上，横屏那张居中。 */
@media (orientation:portrait){
  body{ background-image:url("assets/bg-portrait.png"); }
}
@media (orientation:landscape){
  body{ background-image:url("assets/bg-landscape.png"); }
}
main{
  min-height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  padding:32px 24px 88px; gap:6px;
}
h1{font-size:clamp(34px,9vw,56px); margin:0; letter-spacing:-.01em}
.rule{width:64px; height:4px; background:var(--accent); border-radius:2px; margin:14px 0 10px}
p{margin:0; color:var(--dim); font-size:clamp(16px,4vw,21px)}
.row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:30px}
a.btn{
  display:inline-block; padding:12px 24px; border-radius:10px; text-decoration:none;
  border:1px solid rgba(255,255,255,.22); color:var(--fg); font-size:15px;
}
a.btn.primary{background:var(--accent); color:#1a1400; border-color:transparent; font-weight:600}
a.btn:hover{border-color:var(--dim)}
footer{position:fixed; left:0; right:0; bottom:20px; color:var(--dim); font-size:13px}
</style>
</head>
<body>
<main>
  <h1>爽阅</h1>
  <div class="rule"></div>
  <p>爽快阅读，想看就看。</p>
  <div class="row">
    <a class="btn primary" href="./">进入主页</a>
    <a class="btn" href="https://github.com/leey1994/shuangyuebook/releases/latest">下载</a>
  </div>
</main>
<footer>免费 · 无广告 · Android / Windows 双端</footer>
</body>
</html>
