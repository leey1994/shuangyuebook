<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爽阅 · 开屏</title>
<meta name="description" content="爽阅 —— 爽快阅读，想看就看。">
<link rel="icon" href="assets/favicon.png">
<style>
/* 开屏页：整屏一张背景 + 一句宣传语 + 一个进入按钮。
   文案是真实 HTML 而不是烤进图里 —— 可选中、可被读屏软件读到、
   改一次 slogan.txt 重新生成背景即可，不用改这里。 */
:root{ --fg:#eef3fb; --dim:#9fb0c8; --accent:#ffd65a; }
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:grid; place-items:center; text-align:center;
  background:#0b1020 url("assets/splash-bg.png") center/cover no-repeat;
  color:var(--fg);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{padding:32px; max-width:560px}
/* 背景图已经把「爽阅」和副标题画上去了，这里只补可读文本：
   视觉上重复，但这是无障碍与可选中的唯一可靠来源。 */
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
h1{font-size:clamp(28px,7vw,44px); margin:0 0 10px}
p{margin:0 0 28px; color:var(--dim); font-size:18px}
.row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
a.btn{
  display:inline-block; padding:12px 22px; border-radius:10px; text-decoration:none;
  border:1px solid rgba(255,255,255,.22); color:var(--fg); font-size:15px;
}
a.btn.primary{background:var(--accent); color:#1a1400; border-color:transparent; font-weight:600}
a.btn:hover{border-color:var(--dim)}
footer{position:fixed; left:0; right:0; bottom:20px; color:var(--dim); font-size:13px}
</style>
</head>
<body>
<main>
  <h1 class="sr">爽阅</h1>
  <p class="sr">爽快阅读，想看就看。</p>
  <div class="row">
    <a class="btn primary" href="./">进入主页</a>
    <a class="btn" href="https://github.com/leey1994/shuangyuebook/releases/latest">下载</a>
  </div>
</main>
<footer>免费开源 · 无广告 · Android / Windows 双端</footer>
</body>
</html>
