name: novel_reader
description: 爽阅·多源聚合小说阅读器（内置固化书源 + 阅读 3.0 书源引擎，Android + Windows 双端）
publish_to: none
version: 1.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  html: ^0.15.4
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  window_manager: ^0.4.0
  url_launcher: ^6.3.0
  flutter_tts: ^4.2.0
  crypto: ^3.0.3 # 在线音色合成签名（Sec-MS-GEC）
  audioplayers: ^6.1.0 # 在线音色本地 MP3 播放（Android + Windows）
  archive: ^4.0.0 # EPUB(zip) 解包，纯 Dart 实现
  xml: ^6.5.0 # EPUB OPF/NCX 解析
  fast_gbk: ^1.0.0 # 书源站点 GBK/GB2312 正文解码
  webview_flutter: ^4.14.1 # 隐藏浏览器引擎（仅 Android，用于 JS 令牌墙站点）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# 本地固化 flutter_tts 补丁（Windows SAPI 引擎切换 + 崩溃守卫），见 third_party/flutter_tts
dependency_overrides:
  flutter_tts:
    path: third_party/flutter_tts

flutter:
  uses-material-design: true

  assets:
    - assets/images/ # 无封面时按书名稳定分配的占位插画
    - assets/sources/ # 内置「阅读 3.0」JSON 书源

  fonts:
    # 正文字体：霞鹜文楷 Lite（OFL-1.1，见 assets/fonts/OFL.txt）
    # 体积提示：该字重约 13.5MB，是 APK 的大头；不想要可在
    # lib/theme.dart 把 kReaderFonts 收成只有「系统字体」并删掉本段。
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
